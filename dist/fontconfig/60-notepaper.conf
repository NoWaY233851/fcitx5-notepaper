<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Generated by tools/build.py from tokens.toml. Do not edit by hand.
     "Notepaper" draws Latin letters and digits in Fira Sans and falls back to Noto Serif CJK TC Medium
     for Chinese. Only fonts that ask for "Notepaper" by name are affected. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Notepaper</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Fira Sans</string>
      <string>Noto Serif CJK TC Medium</string>
    </edit>
  </match>
</fontconfig>
