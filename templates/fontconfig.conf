<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Generated by tools/build.py from tokens.toml. Do not edit by hand.
     "$family" draws Latin letters and digits in $latin and falls back to $cjk
     for Chinese. Only fonts that ask for "$family" by name are affected. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>$family</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>$latin</string>
      <string>$cjk</string>
    </edit>
  </match>
</fontconfig>
