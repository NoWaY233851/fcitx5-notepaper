# Generated by tools/build.py from tokens.toml. Do not edit by hand.
# No [AccentColorField] on purpose: the system accent must never replace the terracotta.

[Metadata]
Name=$name
Name[zh_TW]=$name_zh_tw
Version=$version
Author=$author
Description=$description

[InputPanel]
NormalColor=$ink
HighlightCandidateColor=$ink
HighlightColor=$ink
HighlightBackgroundColor=$hl
EnableBlur=False
FullWidthHighlight=False
PageButtonAlignment=Last Candidate

[InputPanel/Background]
Image=panel.svg
Color=$paper
BorderColor=$border
BorderWidth=0

[InputPanel/Background/Margin]
Left=$panel_slice_l
Right=$panel_slice_r
Top=$panel_slice_t
Bottom=$panel_slice_b

[InputPanel/ShadowMargin]
Left=$shadow_l
Right=$shadow_r
Top=$shadow_t
Bottom=$shadow_b

[InputPanel/ContentMargin]
Left=$content_l
Right=$content_r
Top=$content_t
Bottom=$content_b

[InputPanel/TextMargin]
Left=$cell_padding_x
Right=$cell_padding_x
Top=$cell_padding_y
Bottom=$cell_padding_y

[InputPanel/Highlight]
Image=highlight.svg
Color=$hl
Overlay=mark.svg
Gravity=Bottom Left
OverlayOffsetX=$mark_x
OverlayOffsetY=$mark_offset_y
HideOverlayIfOversize=False

[InputPanel/Highlight/Margin]
Left=$cell_padding_x
Right=$cell_padding_x
Top=$cell_padding_y
Bottom=$cell_padding_y

[InputPanel/Highlight/HighlightClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[Menu]
NormalColor=$ink
HighlightCandidateColor=$ink
Spacing=0
EnableBlur=False

[Menu/Background]
Image=menu.svg
Color=$paper
BorderColor=$border
BorderWidth=0

[Menu/Background/Margin]
Left=$menu_slice
Right=$menu_slice
Top=$menu_slice
Bottom=$menu_slice

[Menu/ContentMargin]
Left=$menu_content
Right=$menu_content
Top=$menu_content
Bottom=$menu_content

[Menu/TextMargin]
Left=$menu_padding_x
Right=$menu_padding_x
Top=$menu_padding_y
Bottom=$menu_padding_y

[Menu/Highlight]
Image=menu-highlight.svg
Color=$hl

[Menu/Highlight/Margin]
Left=$menu_padding_x
Right=$menu_padding_x
Top=$menu_padding_y
Bottom=$menu_padding_y

[Menu/Separator]
Image=separator.svg
Color=$border

[Menu/CheckBox]
Image=check.svg

[Menu/SubMenu]
Image=arrow.svg
